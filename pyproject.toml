[project]
name = "food-delivery-time-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.125.0",
    "joblib>=1.2,<1.4",
    "numpy<2",
    "optuna>=4.6.0",
    "pandas>=2.1,<2.2",
    "plotly>=5.5,<6",
    "pycaret==3.3.2",
    "scikit-learn>=1.4,<1.5",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "dvc[gs]>=3.64.0",
    "isort>=7.0.0",
    "jupyterlab>=4.5.0",
    "pre-commit>=4.5.0",
]

[tool.setuptools]
packages.find.where = ["src"]
